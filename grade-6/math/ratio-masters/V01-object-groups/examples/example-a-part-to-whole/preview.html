<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V01 Example A variant: blue to all beads</title>
<style>
body{margin:0;background:#FFFFFF}
.ratio-master{--rm-ink:#1B1F2A;--rm-muted:#4A5263;--rm-panel:#F3F4F7;
--rm-a:#1E5BD8;--rm-a-edge:#123E99;--rm-a-detail:#FFFFFF;--rm-a-text:#1A4FBF;--rm-b:#F5BE0B;--rm-b-edge:#8A6400;--rm-b-detail:#FFFFFF;--rm-b-text:#6E5000;--rm-thread:#9AA1AE;
box-sizing:border-box;max-width:1040px;margin:0 auto;padding:40px 16px 48px;background:#FFFFFF;color:var(--rm-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.ratio-master *,.ratio-master *::before,.ratio-master *::after{box-sizing:border-box}
.ratio-master .rm-question{max-width:34ch;margin:0 auto 28px;text-align:center;font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.3}
.ratio-master .rm-stage{width:min(100%, 540px);margin:0 auto}
.ratio-master .rm-unsorted,.ratio-master .rm-labels,.ratio-master .rm-beads,.ratio-master .rm-nums{position:relative}
.ratio-master .rm-unsorted,.ratio-master .rm-beads{height:0;padding-top:calc(100% / 9)}
.ratio-master .rm-unsorted{margin-bottom:32px}
.ratio-master .rm-labels{height:32px;font-size:18px;font-weight:700}
.ratio-master .rm-answer{padding:8px 0 14px;background:var(--rm-panel);border-radius:16px}
.ratio-master .rm-nums{height:clamp(52px,9vw,76px);margin-top:10px;font-size:clamp(36px,7vw,60px);font-weight:800;font-variant-numeric:tabular-nums}
.ratio-master .rm-cell{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ratio-master .rm-beads .rm-colon{font-size:clamp(28px,5vw,44px);font-weight:800}
.ratio-master .rm-slot{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center}
.ratio-master .rm-slot .rm-obj{display:block;width:84%;height:84%}
.ratio-master .rm-thread{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--rm-thread)}
.ratio-master .rm-obj .rm-body{stroke-width:2}
.ratio-master .rm-obj .rm-detail{stroke-width:1.5}
.ratio-master .rm-obj-a .rm-body{fill:var(--rm-a);stroke:var(--rm-a-edge)}
.ratio-master .rm-obj-a .rm-detail{fill:var(--rm-a-detail);stroke:var(--rm-a-edge)}
.ratio-master .rm-obj-b .rm-body{fill:var(--rm-b);stroke:var(--rm-b-edge)}
.ratio-master .rm-obj-b .rm-detail{fill:var(--rm-b-detail);stroke:var(--rm-b-edge)}
.ratio-master .rm-a-text{color:var(--rm-a-text)}
.ratio-master .rm-b-text{color:var(--rm-b-text)}
.ratio-master .rm-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@keyframes rm-add{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes rm-fade{from{opacity:0}to{opacity:1}}
.ratio-master .rm-move{position:absolute;z-index:1;animation-duration:1s;animation-timing-function:ease-in-out;animation-fill-mode:both}
@keyframes rm-mv-n400{from{transform:translate(-400%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-n400{animation-name:rm-mv-n400}
@keyframes rm-mv-n300{from{transform:translate(-300%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-n300{animation-name:rm-mv-n300}
@keyframes rm-mv-n200{from{transform:translate(-200%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-n200{animation-name:rm-mv-n200}
@keyframes rm-mv-n100{from{transform:translate(-100%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-n100{animation-name:rm-mv-n100}
@keyframes rm-mv-p0{from{transform:translate(0%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-p0{animation-name:rm-mv-p0}
.ratio-master .rm-fade{animation:rm-fade .5s ease-out both}
.ratio-master .rm-add{animation:rm-add .6s ease-out both}
@media (prefers-reduced-motion: reduce){.ratio-master .rm-move,.ratio-master .rm-fade,.ratio-master .rm-add{animation:none}}
</style>
</head>
<body>
<div class="ratio-master" data-master="V01" data-kind="part_to_whole" data-skin="beads">
<h2 class="rm-question">What is the ratio of blue beads to all the beads?</h2>
<p class="rm-sr">Unsorted: 5 beads: blue, yellow, blue, yellow, blue. Sorted: 3 blue beads on the left, all 5 beads on the right. blue : all = 3 : 5.</p>
<div class="rm-stage" aria-hidden="true">
<div class="rm-unsorted">
<span class="rm-thread" style="left: 27.778%; width: 44.444%"></span>
<span class="rm-slot" style="left: 22.222%; width: 11.111%"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot" style="left: 33.333%; width: 11.111%"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot" style="left: 44.444%; width: 11.111%"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot" style="left: 55.556%; width: 11.111%"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot" style="left: 66.667%; width: 11.111%"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
</div>
<div class="rm-answer">
<div class="rm-labels"><span class="rm-cell rm-a-text rm-fade" style="left: 0%; width: 33.333%; animation-delay: 3.5s">blue</span><span class="rm-cell rm-fade" style="left: 33.333%; width: 11.111%; animation-delay: 3.5s"></span><span class="rm-cell rm-fade" style="left: 44.444%; width: 55.556%; animation-delay: 3.5s">all</span></div>
<div class="rm-beads">
<span class="rm-slot rm-move rm-mv-n200" style="left: 44.444%; width: 11.111%; animation-delay: 0.8s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-move rm-mv-n400" style="left: 77.778%; width: 11.111%; animation-delay: 1s"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-move rm-mv-n100" style="left: 55.556%; width: 11.111%; animation-delay: 1.2s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-move rm-mv-n300" style="left: 88.889%; width: 11.111%; animation-delay: 1.4s"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-move rm-mv-p0" style="left: 66.667%; width: 11.111%; animation-delay: 1.6s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-fade" style="left: 0%; width: 11.111%; animation-delay: 2.7s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-fade" style="left: 11.111%; width: 11.111%; animation-delay: 2.7s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-slot rm-fade" style="left: 22.222%; width: 11.111%; animation-delay: 2.7s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></span>
<span class="rm-cell rm-colon rm-fade" style="left: 33.333%; width: 11.111%; animation-delay: 3.5s">:</span>
</div>
<div class="rm-nums"><span class="rm-cell rm-a-text rm-add" style="left: 0%; width: 33.333%; animation-delay: 4.2s">3</span><span class="rm-cell rm-add" style="left: 33.333%; width: 11.111%; animation-delay: 4.2s">:</span><span class="rm-cell rm-add" style="left: 44.444%; width: 55.556%; animation-delay: 4.2s">5</span></div>
</div>
</div>
</div>
</body>
</html>
