<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V01 Skin test: blue to yellow blocks</title>
<style>
body{margin:0;background:#FFFFFF}
.ratio-master{--rm-ink:#1B1F2A;--rm-muted:#4A5263;--rm-panel:#F3F4F7;
--rm-a:#1E5BD8;--rm-a-edge:#123E99;--rm-a-detail:#4C7FE6;--rm-a-text:#1A4FBF;--rm-b:#F5BE0B;--rm-b-edge:#8A6400;--rm-b-detail:#FAD55C;--rm-b-text:#6E5000;--rm-thread:transparent;
box-sizing:border-box;max-width:1040px;margin:0 auto;padding:40px 16px 48px;background:#FFFFFF;color:var(--rm-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.ratio-master *,.ratio-master *::before,.ratio-master *::after{box-sizing:border-box}
.ratio-master .rm-question{max-width:34ch;margin:0 auto 28px;text-align:center;font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.3}
.ratio-master .rm-stage{width:min(100%, 360px);margin:0 auto}
.ratio-master .rm-unsorted,.ratio-master .rm-labels,.ratio-master .rm-beads,.ratio-master .rm-nums{position:relative}
.ratio-master .rm-unsorted,.ratio-master .rm-beads{height:0;padding-top:calc(100% / 6)}
.ratio-master .rm-unsorted{margin-bottom:32px}
.ratio-master .rm-labels{height:32px;font-size:18px;font-weight:700}
.ratio-master .rm-answer{padding:8px 0 14px;background:var(--rm-panel);border-radius:16px}
.ratio-master .rm-nums{height:clamp(52px,9vw,76px);margin-top:10px;font-size:clamp(36px,7vw,60px);font-weight:800;font-variant-numeric:tabular-nums}
.ratio-master .rm-cell{position:absolute;top:0;bottom:0;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.ratio-master .rm-beads .rm-colon{font-size:clamp(28px,5vw,44px);font-weight:800}
.ratio-master .rm-slot{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center}
.ratio-master .rm-slot .rm-obj{display:block;width:84%;height:84%}
.ratio-master .rm-thread{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--rm-thread)}
.ratio-master .rm-obj .rm-body{stroke-width:2}
.ratio-master .rm-obj .rm-detail{stroke-width:1.5}
.ratio-master .rm-obj-a .rm-body{fill:var(--rm-a);stroke:var(--rm-a-edge)}
.ratio-master .rm-obj-a .rm-detail{fill:var(--rm-a-detail);stroke:var(--rm-a-edge)}
.ratio-master .rm-obj-b .rm-body{fill:var(--rm-b);stroke:var(--rm-b-edge)}
.ratio-master .rm-obj-b .rm-detail{fill:var(--rm-b-detail);stroke:var(--rm-b-edge)}
.ratio-master .rm-a-text{color:var(--rm-a-text)}
.ratio-master .rm-b-text{color:var(--rm-b-text)}
.ratio-master .rm-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@keyframes rm-add{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes rm-fade{from{opacity:0}to{opacity:1}}
.ratio-master .rm-move{position:absolute;z-index:1;animation-duration:1s;animation-timing-function:ease-in-out;animation-fill-mode:both}
@keyframes rm-mv-n250{from{transform:translate(-250%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-n250{animation-name:rm-mv-n250}
@keyframes rm-mv-n150{from{transform:translate(-150%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-n150{animation-name:rm-mv-n150}
@keyframes rm-mv-p50{from{transform:translate(50%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-p50{animation-name:rm-mv-p50}
@keyframes rm-mv-p150{from{transform:translate(150%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-p150{animation-name:rm-mv-p150}
@keyframes rm-mv-p250{from{transform:translate(250%, calc(-100% - 72px))}to{transform:none}}
.ratio-master .rm-mv-p250{animation-name:rm-mv-p250}
.ratio-master .rm-fade{animation:rm-fade .5s ease-out both}
.ratio-master .rm-add{animation:rm-add .6s ease-out both}
@media (prefers-reduced-motion: reduce){.ratio-master .rm-move,.ratio-master .rm-fade,.ratio-master .rm-add{animation:none}}
</style>
</head>
<body>
<div class="ratio-master" data-master="V01" data-kind="part_to_part" data-skin="blocks">
<h2 class="rm-question">What is the ratio of blue blocks to yellow blocks?</h2>
<p class="rm-sr">Unsorted: 5 blocks: blue, yellow, blue, yellow, blue. Sorted: 3 blue blocks on the left, 2 yellow blocks on the right. blue : yellow = 3 : 2.</p>
<div class="rm-stage" aria-hidden="true">
<div class="rm-unsorted">
<span class="rm-thread" style="left: 16.667%; width: 66.667%"></span>
<span class="rm-slot" style="left: 8.333%; width: 16.667%"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot" style="left: 25%; width: 16.667%"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot" style="left: 41.667%; width: 16.667%"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot" style="left: 58.333%; width: 16.667%"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot" style="left: 75%; width: 16.667%"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
</div>
<div class="rm-answer">
<div class="rm-labels"><span class="rm-cell rm-a-text rm-fade" style="left: 0%; width: 50%; animation-delay: 2.6s">blue</span><span class="rm-cell rm-fade" style="left: 50%; width: 16.667%; animation-delay: 2.6s"></span><span class="rm-cell rm-b-text rm-fade" style="left: 66.667%; width: 33.333%; animation-delay: 2.6s">yellow</span></div>
<div class="rm-beads">
<span class="rm-slot rm-move rm-mv-p50" style="left: 0%; width: 16.667%; animation-delay: 0.8s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot rm-move rm-mv-n250" style="left: 66.667%; width: 16.667%; animation-delay: 1s"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot rm-move rm-mv-p150" style="left: 16.667%; width: 16.667%; animation-delay: 1.2s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot rm-move rm-mv-n150" style="left: 83.333%; width: 16.667%; animation-delay: 1.4s"><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-slot rm-move rm-mv-p250" style="left: 33.333%; width: 16.667%; animation-delay: 1.6s"><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" focusable="false"><rect class="rm-body" x="2" y="2" width="28" height="28" rx="4"></rect><rect class="rm-detail" x="9" y="9" width="14" height="14" rx="2"></rect></svg></span>
<span class="rm-cell rm-colon rm-fade" style="left: 50%; width: 16.667%; animation-delay: 2.6s">:</span>
</div>
<div class="rm-nums"><span class="rm-cell rm-a-text rm-add" style="left: 0%; width: 50%; animation-delay: 3.3s">3</span><span class="rm-cell rm-add" style="left: 50%; width: 16.667%; animation-delay: 3.3s">:</span><span class="rm-cell rm-b-text rm-add" style="left: 66.667%; width: 33.333%; animation-delay: 3.3s">2</span></div>
</div>
</div>
</div>
</body>
</html>
