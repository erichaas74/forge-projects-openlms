<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V02 Example A: ratio</title>
<style>
body{margin:0;background:#FFFFFF}
.ratio-master{--rm-ink:#1B1F2A;--rm-muted:#4A5263;--rm-panel:#F3F4F7;--rm-rule:#C9CED7;
--rm-a:#1E5BD8;--rm-a-edge:#123E99;--rm-a-detail:#FFFFFF;--rm-a-text:#1A4FBF;--rm-b:#F5BE0B;--rm-b-edge:#8A6400;--rm-b-detail:#FFFFFF;--rm-b-text:#6E5000;
box-sizing:border-box;max-width:1040px;margin:0 auto;padding:40px 16px 48px;background:#FFFFFF;color:var(--rm-ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.ratio-master *,.ratio-master *::before,.ratio-master *::after{box-sizing:border-box}
.ratio-master .rm-question{max-width:34ch;margin:0 auto 28px;text-align:center;font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.3}
.ratio-master .rm-model{display:flex;flex-direction:column;gap:10px;max-width:520px;margin:0 auto}
.ratio-master .rm-pair{display:grid;grid-template-columns:minmax(0,1fr) 2px minmax(0,1fr);align-items:center;column-gap:18px}
.ratio-master .rm-pair > :first-child{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.ratio-master .rm-pair > :last-child{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:6px}
.ratio-master .rm-split{align-self:stretch;background:var(--rm-rule)}
.ratio-master .rm-group{padding:12px 0;background:var(--rm-panel);border-radius:14px}
.ratio-master .rm-head{font-size:20px;font-weight:700}
.ratio-master .rm-totals{margin-top:6px;padding-top:12px;border-top:3px solid var(--rm-ink)}
.ratio-master .rm-totals .rm-split{background:transparent}
.ratio-master .rm-total{position:relative;display:inline-block;min-width:64px;padding:2px 12px;border-radius:12px;text-align:center;font-size:40px;font-weight:800;line-height:1.2;font-variant-numeric:tabular-nums}
.ratio-master .rm-answer{outline:3px solid var(--rm-ink)}
.ratio-master .rm-q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#FFFFFF;color:var(--rm-muted)}
.ratio-master .rm-obj{display:block;width:36px;height:36px;flex:none}
.ratio-master .rm-obj .rm-body{stroke-width:2}
.ratio-master .rm-obj .rm-detail{stroke-width:1.5}
.ratio-master .rm-obj-a .rm-body{fill:var(--rm-a);stroke:var(--rm-a-edge)}
.ratio-master .rm-obj-a .rm-detail{fill:var(--rm-a-detail);stroke:var(--rm-a-edge)}
.ratio-master .rm-obj-b .rm-body{fill:var(--rm-b);stroke:var(--rm-b-edge)}
.ratio-master .rm-obj-b .rm-detail{fill:var(--rm-b-detail);stroke:var(--rm-b-edge)}
.ratio-master .rm-a-text{color:var(--rm-a-text)}
.ratio-master .rm-b-text{color:var(--rm-b-text)}
.ratio-master .rm-notation{display:flex;align-items:center;justify-content:center;gap:16px;margin:28px 0 0;font-size:40px;font-weight:800;font-variant-numeric:tabular-nums}
.ratio-master .rm-frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1.15}
.ratio-master .rm-frac > span{padding:0 8px}
.ratio-master .rm-frac > span + span{border-top:4px solid var(--rm-ink)}
.ratio-master .rm-sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
@keyframes rm-add{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes rm-fade{from{opacity:0}to{opacity:1}}
@keyframes rm-out{from{opacity:1}to{opacity:0}}
.ratio-master .rm-step{animation:rm-add .6s ease-out both}
.ratio-master .rm-fade{animation:rm-fade .5s ease-out both}
.ratio-master .rm-out{animation:rm-out .4s ease-out both}
@media (prefers-reduced-motion: reduce){.ratio-master .rm-step,.ratio-master .rm-fade{animation:none}.ratio-master .rm-q{display:none}}
@media (max-width: 480px){.ratio-master .rm-obj{width:30px;height:30px}.ratio-master .rm-pair{column-gap:10px}.ratio-master .rm-total{font-size:32px}}
</style>
</head>
<body>
<div class="ratio-master" data-master="V02" data-skin="beads">
<h2 class="rm-question">2 blue beads go with 3 yellow beads. How many yellow beads go with 6 blue beads?</h2>
<p class="rm-sr">Each group has 2 blue beads on the left and 3 yellow beads on the right. There are 3 groups. That makes 6 blue and 9 yellow beads.</p>
<div class="rm-model" aria-hidden="true">
<div class="rm-pair rm-head"><span class="rm-a-text">blue</span><span class="rm-split"></span><span class="rm-b-text">yellow</span></div>
<div class="rm-pair rm-group"><div><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></div><span class="rm-split"></span><div><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></div></div>
<div class="rm-pair rm-group rm-step" style="animation-delay: 1s"><div><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></div><span class="rm-split"></span><div><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></div></div>
<div class="rm-pair rm-group rm-step" style="animation-delay: 2s"><div><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-a" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></div><span class="rm-split"></span><div><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg><svg class="rm-obj rm-obj-b" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><circle class="rm-body" cx="16" cy="16" r="14"></circle><circle class="rm-detail" cx="16" cy="16" r="4.5"></circle></svg></div></div>
<div class="rm-pair rm-totals"><div><span class="rm-total rm-a-text rm-fade" style="animation-delay: 2.8s">6</span></div><span class="rm-split"></span><div><span class="rm-total rm-answer rm-b-text">9<span class="rm-q rm-out" style="animation-delay: 3.6s">?</span></span></div></div>
</div>
<p class="rm-notation rm-fade" style="animation-delay: 4.4s" aria-label="2 to 3 equals 6 to 9"><span><span class="rm-a-text">2</span> : <span class="rm-b-text">3</span></span><span>=</span><span><span class="rm-a-text">6</span> : <span class="rm-b-text">9</span></span></p>
</div>
</body>
</html>
